server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/jobrunr;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

org:
  jobrunr:
    background-job-server:
      enabled: true
      worker-count: 4
    dashboard:
      enabled: true
      port: 8000
    database:
      type: sql
      datasource: jdbc:h2:file:./data/jobrunr;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      # fallback to memory if H2 file not writable: set JOBRUNR_DATABASE_TYPE=memory

logging:
  level:
    org.jobrunr: INFO
    com.hedgefund: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
