binance:
  baseUrl: "https://api.binance.com"
  symbols: ["BTCUSDT", "ETHUSDT", "BNBUSDT"]
  interval: "1d"
  limit: 30
  concurrency: 3
  retry: {maxAttempts: 3, backoffMs: 800, maxBackoffMs: 8000}
  rateLimit: {qps: 2, burst: 4}
  paths: {bronze: "data/bronze/binance", silver: "data/silver/binance", catalog: "catalog/glue.json"}
