fred:
  baseUrl: "https://fred.stlouisfed.org"
  apiKey: ""  # Register at https://fred.stlouisfed.org/docs/api/api_key.html for free API key
  series: ["DGS10", "DFF", "UNRATE", "CPIAUCSL", "T10Y2Y"]
  limit: 3650
  concurrency: 3
  retry: {maxAttempts: 3, backoffMs: 800, maxBackoffMs: 8000}
  rateLimit: {qps: 2, burst: 4}
  paths: {bronze: "data/bronze/fred", silver: "data/silver/fred", catalog: "catalog/glue.json"}
