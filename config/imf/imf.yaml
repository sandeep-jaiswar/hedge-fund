imf:
  baseUrl: "http://dataservices.imf.org"
  symbols: ["NGDP_RPCH", "PCPIPCH", "LUR", "XRPUS"]  # GDP growth, Inflation, Unemployment, Exchange rate
  concurrency: 2
  retry: {maxAttempts: 3, backoffMs: 800, maxBackoffMs: 8000}
  rateLimit: {qps: 2, burst: 4}
  paths: {bronze: "data/bronze/imf", silver: "data/silver/imf", catalog: "catalog/glue.json"}
