      bronze: data/bronze/sina
      silver: data/silver/sina
      catalog: catalog/glue.json

  tencent:
    baseUrl: https://qt.gtimg.cn
    symbols: [sh000001, sz399001, hkHSI]
    concurrency: 2
    retry:
      maxAttempts: 3
      backoffMs: 800
