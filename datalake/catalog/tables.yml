# Single source of truth for file-based datalake layout.
# Liquibase (010-reset.xml) is the source of truth for the DuckDB 3NF schema.
# This file documents the physical file layout used by ingesters and SilverMerger.
version: 2
storage:
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  format: parquet
  compression: zstd
  bronze_format: raw

defaults:
  watermark: _watermark.json
  batch_id: uuid
  checksum: sha256

# ═══════════════════════════════════════════════════════════════════
# BRONZE LAYER — per-source, append-only, raw API responses
# Each ingester writes to data/bronze/{source}/key={safe_key}/data.raw
# ═══════════════════════════════════════════════════════════════════
bronze_sources:
  - id: yahoo
    local: data/bronze/yahoo/
    pattern: "key={symbol}/data.raw"
  - id: cboe
    local: data/bronze/cboe/
    pattern: "key={symbol}/data.raw"
  - id: binance
    local: data/bronze/binance/
    pattern: "key={pair}/data.raw"
  - id: coinbase
    local: data/bronze/coinbase/
    pattern: "key={pair}/data.raw"
  - id: defillama
    local: data/bronze/defillama/
    pattern: "key={protocol}/data.raw"
  - id: worldbank
    local: data/bronze/worldbank/
    pattern: "key={indicator}/data.raw"
  - id: fred
    local: data/bronze/fred/
    pattern: "key={series}/data.raw"
  - id: treasury
    local: data/bronze/treasury/
    pattern: "key=treasury/data.raw"
  - id: sec
    local: data/bronze/sec/
    pattern: "key={symbol}/data.raw"
  - id: imf
    local: data/bronze/imf/
    pattern: "key={indicator}/data.raw"
  - id: oecd
    local: data/bronze/oecd/
    pattern: "key={indicator}/data.raw"
  - id: calcfi
    local: data/bronze/calcfi/
    pattern: "key=series/data.raw"
  - id: fdic
    local: data/bronze/fdic/
    pattern: "key=rates/data.raw"
  - id: eia
    local: data/bronze/eia/
    pattern: "key=petroleum/data.raw"
  - id: bls
    local: data/bronze/bls/
    pattern: "key={series}/data.raw"
  - id: bea
    local: data/bronze/bea/
    pattern: "key=nipa/data.raw"
  - id: gmd
    local: data/bronze/gmd/
    pattern: "key=gmd/data.raw"
  - id: tencent
    local: data/bronze/tencent/
    pattern: "key={symbol}/data.raw"
  - id: sina
    local: data/bronze/sina/
    pattern: "key={symbol}/data.raw"
  - id: eastmoney
    local: data/bronze/eastmoney/
    pattern: "key={symbol}/data.raw"
  - id: baostock
    local: data/bronze/baostock/
    pattern: "key={symbol}/data.raw"
  - id: investing
    local: data/bronze/investing/
    pattern: "key={category}/data.raw"

# ═══════════════════════════════════════════════════════════════════
# SILVER LAYER — typed CSVs + Parquet from ingesters
# DuckDB 3NF schema (dim.fact_*, dim.dim_*) is the primary query layer.
# These files are intermediate outputs of the ingestion pipeline.
# ═══════════════════════════════════════════════════════════════════
silver_files:
  - id: yahoo_ohlcv
    local: data/silver/yahoo/yahoo_ohlcv.csv
    columns: [symbol, date, epoch, open, high, low, close, adj_close, volume]
    feeds_fact: fact_market_ohlcv

  - id: market_ohlcv
    local: data/silver/market/ohlcv.parquet
    columns: [symbol, date, epoch, open, high, low, close, adj_close, volume, _source, _ingest_ts, _batch_id, _is_valid, year]
    feeds_fact: fact_market_ohlcv

  - id: macro_observations
    local: data/silver/macro/observations.parquet
    columns: [indicator_id, indicator_name, country_id, country_name, country_iso3, date, year, period_type, value, unit, obs_status, decimal, source_id, lastupdated, is_valid]
    feeds_fact: fact_macro_obs

  - id: equity_master
    local: data/silver/master/equity/equity_master.parquet
    feeds_dim: dim_instrument, dim_equity

# ═══════════════════════════════════════════════════════════════════
# DUCKDB 3NF SCHEMA — managed by Liquibase (010-reset.xml)
# Query via: ./gradlew :libs:datalake:run --args="query \"SQL\""
# ═══════════════════════════════════════════════════════════════════
duckdb:
  file: hedge-fund.duckdb
  schemas:
    dim:
      dimensions:
        - dim_currency (currency_id, currency_code, currency_name)
        - dim_asset_class (asset_class_id, asset_class_code, asset_class_name)
        - dim_industry (industry_id, industry_name)
        - dim_sector (sector_id, sector_name, industry_id FK)
        - dim_exchange (exchange_id, exchange_code, exchange_name, country_iso3, currency_id FK, timezone)
        - dim_instrument (instrument_id, symbol, name, asset_class_id FK, exchange_id FK, currency_id FK, sector_id FK, lot_size, isin, SCD2 cols)
        - dim_equity (instrument_id FK, outstanding_shares, market_cap, listing_date)
        - dim_country (country_iso3, country_id, country_name, region)
        - dim_indicator (indicator_id, indicator_name, source_id, unit, frequency)
      facts:
        - fact_market_ohlcv (instrument_id FK, date, OHLCV + year)
        - fact_crypto_ohlcv (instrument_id FK, date, OHLCV + trades + year)
        - fact_macro_obs (indicator_id FK, country_iso3 FK, date, value, source_id)
        - fact_rates_daily (indicator_id, date, value, source_id)
        - fact_filings (instrument_id FK, accession_number, form_type, filing_date)

    hedge_gold:
      views:
        - vw_returns_daily (symbol, date, close, ret_1d)
        - vw_returns_cumulative (symbol, date, cum_return)
        - vw_volatility_30d (symbol, date, vol_30d_annualized)
        - vw_macro_yoy (indicator_id, country_iso3, date, value, yoy_pct)
        - vw_instrument_detail (denormalized instrument with all dims)
        - vw_source_coverage (row counts per table)
        - yahoo_summary (bars, avg_close per symbol)
        - worldbank_yoy (subset of vw_macro_yoy)
        - all_sources_summary (alias for vw_source_coverage)

    ref: [currency, asset_class, industry, sector, country, indicator, exchange]
    master: [instrument, equity, instrument_detail, equity_india]
    market: [ohlcv, crypto, filings]
    macro: [observation, rates]
    staging: [yahoo_ohlcv, fred_series, sec_filings, treasury, binance_meta, coinbase_meta, defillama_meta, cboe_meta]
