services:
  # ============================================
  # Observability Stack
  # ============================================
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hedge-network

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - hedge-network

  # ============================================
  # Ingestion UI
  # ============================================
  ingestion-ui:
    build:
      context: .
      dockerfile: apps/ingestion-ui/Dockerfile
    ports:
      - "8080:8080"
      - "8000:8000"
    volumes:
      - datalake-data:/app/datalake
      - ./config:/app/config:ro
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - HEDGE_ENVIRONMENT=docker
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - hedge-network

  # ============================================
  # Ingest Runner (profile-gated, one image for all 22 sources)
  # Run per source: HEDGE_SOURCE=fred docker compose --profile ingest run ingest-runner
  # ============================================
  ingest-runner:
    profiles: [ingest]
    build:
      context: .
      dockerfile: services/ingest-runner/Dockerfile
    volumes:
      - datalake-data:/app/datalake
      - ./config:/app/config:ro
    environment:
      - HEDGE_SOURCE=${HEDGE_SOURCE:-yahoo}
    networks:
      - hedge-network

  gold-aggregator:
    profiles: [ingest]
    build:
      context: .
      dockerfile: services/gold-aggregator/Dockerfile
    volumes:
      - datalake-data:/app/datalake
    networks:
      - hedge-network

volumes:
  datalake-data:
    driver: local
  grafana-data:
    driver: local

networks:
  hedge-network:
    driver: bridge
