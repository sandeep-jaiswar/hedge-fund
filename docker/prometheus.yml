global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ingestion-ui'
    static_configs:
      - targets: ['ingestion-ui:8081']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s

  - job_name: 'hedge-fund-services'
    static_configs:
      - targets: ['ingestion-ui:8081']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
