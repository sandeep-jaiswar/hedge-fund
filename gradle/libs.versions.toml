[versions]
java = "21"
junit = "5.11.3"
mockito = "5.14.2"
slf4j = "2.0.16"
logback = "1.5.8"
jackson = "2.18.2"
duckdb = "1.3.2.0"
awsSdk = "2.25.27"
testcontainers = "1.19.8"
floci = "1.4.0"
snakeyaml = "2.3"
wiremock = "3.9.1"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
duckdb-jdbc = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awsSdk" }
aws-glue = { module = "software.amazon.awssdk:glue", version.ref = "awsSdk" }
aws-athena = { module = "software.amazon.awssdk:athena", version.ref = "awsSdk" }
aws-firehose = { module = "software.amazon.awssdk:firehose", version.ref = "awsSdk" }
testcontainers-floci = { module = "io.floci:testcontainers-floci", version.ref = "floci" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }

[plugins]
# keep versions here for DRY - single source of truth
